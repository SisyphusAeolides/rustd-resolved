[Resolve]
#DNS=
#FallbackDNS=1.1.1.1 1.0.0.1 9.9.9.9 149.112.112.112
#Domains=
#Cache=yes
#DNSCacheSize=4096
# Exclusive host mode publishes /run/rustd/resolve/{stub-resolv.conf,resolv.conf}.
# /etc/resolv.conf is linked to the stub by rustd-resolved-tmpfiles.
DNSStubListener=yes
#ReadEtcHosts=yes
#ResolveUnicastSingleLabel=no
