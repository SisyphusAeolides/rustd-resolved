# RustD exclusive DNS: NetworkManager must not own /etc/resolv.conf.
# Use 99-* so this overrides distro dns.conf files that set dns=systemd-resolved.
# NM still publishes DHCP/VPN DNS under /run/NetworkManager/resolv.conf for
# rustd-resolved to ingest as uplinks; the stub symlink is owned by RustD.
[main]
dns=none
rc-manager=unmanaged
systemd-resolved=false
