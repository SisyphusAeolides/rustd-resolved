d /run/rustd 0755 root root -
d /run/rustd/network 0755 root root -
d /run/rustd/network/links 0755 root root -
d /run/rustd/resolve 0755 rustd-resolve rustd-resolve -
d /run/dnssec-trust-anchors.d 0755 rustd-resolve rustd-resolve -
d /var/lib/rustd 0755 root root -
d /var/lib/rustd/resolved 0750 rustd-resolve rustd-resolve -
# Seed the stub before linking /etc/resolv.conf so early boot does not point at a
# missing target between rustd-tmpfiles-setup and rustd-resolved startup.
f+ /run/rustd/resolve/stub-resolv.conf 0644 rustd-resolve rustd-resolve - "# Managed by rustd-resolved\nnameserver 127.0.0.53\noptions edns0 trust-ad\n"
# Exclusive host mode: resolve through RustD's 127.0.0.53 stub.
# L+ deliberately replaces an existing resolver-owned link or file.
L+ /etc/resolv.conf - - - - /run/rustd/resolve/stub-resolv.conf
# resolver runtime files and sockets are owned by rustd-resolved
