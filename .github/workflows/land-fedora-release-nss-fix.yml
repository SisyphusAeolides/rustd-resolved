name: Land Fedora resolver release NSS correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-release-nss-fix.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Correct final Fedora NSS invariant
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/final-release-closure.yml')
          s=p.read_text()
          old="          grep -Fq 'hosts: files myhostname rustd_dns [!UNAVAIL=return] dns' packaging/nsswitch.conf.fragment\n"
          new="""          grep -Fq 'hosts: files rustd_dns [!UNAVAIL=return] dns' packaging/nsswitch.conf.fragment
          ! grep -Eq '^hosts:.*\\b(myhostname|resolve|systemd)\\b' packaging/nsswitch.conf.fragment
"""
          if new not in s:
              if old not in s:
                  raise SystemExit('obsolete NSS release assertion not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq "hosts: files rustd_dns [!UNAVAIL=return] dns" packaging/nsswitch.conf.fragment
          ! grep -Eq '^hosts:.*\b(myhostname|resolve|systemd)\b' <(grep '^hosts:' packaging/nsswitch.conf.fragment)
          git diff --check
          git fetch origin main
          git rebase --autostash origin/main
          git add .github/workflows/final-release-closure.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Require systemd-free Fedora resolver NSS'
          git push origin HEAD:main
