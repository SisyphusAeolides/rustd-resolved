name: Wire resolvectl D-Bus commands

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wire-resolvectl-dbus.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install live-contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl \
            python3 python3-dbus python3-gi python3-yaml

      - name: Wire and validate D-Bus link management
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/bin/rustd_resolvectl_impl.rs")
          source = path.read_text()

          old_import = "use rustd_resolved::json::{self, JsonObject, Value};\n"
          new_import = old_import + "use rustd_resolved::resolvectl_dbus;\n"
          if source.count(old_import) != 1:
              raise SystemExit("expected exactly one resolvectl json import")
          source = source.replace(old_import, new_import, 1)

          execute_anchor = '''    let Some(options) = parse_options(raw_arguments)? else {\n        return Ok(());\n    };\n    execute_options(&options)\n'''
          execute_replacement = '''    if env::var("SYSTEMD_INVOKED_AS").ok().as_deref() == Some("resolvconf") {\n        let mut input = String::new();\n        if resolvectl_dbus::resolvconf_requires_input(&raw_arguments)? {\n            io::stdin().read_to_string(&mut input)?;\n        }\n        return resolvectl_dbus::execute_resolvconf(&raw_arguments, &input);\n    }\n\n    let Some(options) = parse_options(raw_arguments)? else {\n        return Ok(());\n    };\n    execute_options(&options)\n'''
          if source.count(execute_anchor) != 1:
              raise SystemExit("expected exactly one native option-dispatch boundary")
          source = source.replace(execute_anchor, execute_replacement, 1)

          command_anchor = '''        command\n            if matches!(\n                command,\n                "dns"\n                    | "domain"\n                    | "default-route"\n                    | "llmnr"\n                    | "mdns"\n                    | "dnsovertls"\n                    | "dnssec"\n                    | "nta"\n            ) && options.arguments.is_empty() =>\n        {\n            show_configuration_field(&options.socket, command, options.json.as_deref())\n        }\n'''
          command_replacement = '''        command\n            if resolvectl_dbus::is_command(command) && !options.arguments.is_empty() =>\n        {\n            resolvectl_dbus::execute(command, &options.arguments, options.json.as_deref())\n        }\n        command\n            if matches!(\n                command,\n                "dns"\n                    | "domain"\n                    | "default-route"\n                    | "llmnr"\n                    | "mdns"\n                    | "dnsovertls"\n                    | "dnssec"\n                    | "nta"\n            ) && options.arguments.is_empty() =>\n        {\n            show_configuration_field(&options.socket, command, options.json.as_deref())\n        }\n'''
          if source.count(command_anchor) != 1:
              raise SystemExit("expected exactly one configuration command dispatch block")
          source = source.replace(command_anchor, command_replacement, 1)
          path.write_text(source)
          PY

          cargo fmt --all -- --check
          cargo test --locked resolvectl_dbus::tests
          cargo build --release --locked
          bash tests/dbus-introspection.sh target/release/rustd-resolved target/release/rustd-resolvectl

          git rm -- .github/workflows/wire-resolvectl-dbus.yml
          expected=$'.github/workflows/wire-resolvectl-dbus.yml\nsrc/bin/rustd_resolvectl_impl.rs'
          changed="$(git diff HEAD --name-only | sort)"
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected source changes:\n%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git add -- src/bin/rustd_resolvectl_impl.rs
          git commit -m 'Restore resolver compatibility commands'
          git push origin HEAD:main
