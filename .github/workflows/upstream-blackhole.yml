name: Upstream blackhole failover

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-blackhole-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Build resolver
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Exercise 20 independent silent-primary failovers
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/rustd-upstream-blackhole-ci.jsonl
          python3 tests/scenarios/upstream_blackhole_cert.py \
            target/release/rustd-resolved \
            --iterations 20 \
            --evidence-out "$evidence" \
            2>&1 | tee /tmp/upstream-blackhole.log
          chmod 0600 "$evidence"
          python3 - "$evidence" "$GITHUB_SHA" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("blackhole evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(records) != 1:
              raise SystemExit(f"expected one blackhole evidence record, got {len(records)}")
          record = records[0]
          if record.get("gate") != "dns.upstream_blackhole" or record.get("status") != "pass":
              raise SystemExit("blackhole evidence gate/status is invalid")
          if record.get("resolver_sha") != expected_sha:
              raise SystemExit("blackhole evidence resolver_sha does not match GITHUB_SHA")
          if int(record.get("iterations", 0)) < 20:
              raise SystemExit("blackhole evidence records fewer than 20 iterations")
          if not str(record.get("detail", "")).strip():
              raise SystemExit("blackhole evidence detail is empty")
          print("certification evidence OK: dns.upstream_blackhole")
          PY

      - name: Upload failover evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-blackhole-${{ github.sha }}
          path: |
            /tmp/upstream-blackhole.log
            /tmp/rustd-upstream-blackhole-ci.jsonl
          if-no-files-found: warn
          retention-days: 14
