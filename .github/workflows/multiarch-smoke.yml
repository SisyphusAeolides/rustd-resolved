name: multiarch-smoke

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Native build and NSS gates
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libssl-dev liburing-dev pkg-config
          make check-packaging check-nss
          cargo test --locked --lib
      - name: AArch64 release build
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: bash scripts/aarch64-cross-build.sh
