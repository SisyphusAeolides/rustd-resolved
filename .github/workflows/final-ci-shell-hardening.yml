name: Final CI shell hardening
# run now

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-ci-shell-hardening.yml

permissions:
  contents: write

concurrency:
  group: final-ci-shell-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Transform and validate every workflow
        id: transform
        continue-on-error: true
        run: |
          exec > >(tee /tmp/ci-shell-hardening.log) 2>&1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-yaml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml

          strict = "defaults:\n  run:\n    shell: 'bash --noprofile --norc -euo pipefail {0}'\n\n"
          workflows = Path('.github/workflows')
          for path in sorted(workflows.glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^\s*shell:\s*bash\s*\n', '', text)
              if not re.search(r'(?m)^defaults:\s*$', text):
                  lines = text.splitlines(keepends=True)
                  if not lines or not lines[0].startswith('name:'):
                      raise RuntimeError(f'{path}: first YAML key must be name')
                  text = lines[0] + '\n' + strict + ''.join(lines[1:])
              yaml.safe_load(text)
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check-ci-shell-safety.py
          git diff --check

      - name: Publish result
        if: always()
        run: |
          outcome='${{ steps.transform.outcome }}'
          if [[ "$outcome" == success ]]; then
            git fetch origin main
            git rebase origin/main
            python3 scripts/check-ci-shell-safety.py
            rm -f .github/workflows/harden-ci-shells.yml \
                  .github/workflows/final-ci-shell-hardening.yml
            git add -A .github/workflows scripts/check-ci-shell-safety.py
            git diff --cached --check
            git config user.name 'Kenny Glauner'
            git config user.email 'SisyphusAeolides@pm.me'
            git commit -m 'Enforce strict CI shell execution'
            git push origin HEAD:main
            exit 0
          fi

          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-resolved-ci-shell-hardening-v1\nstatus=failure\ntested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 200 /tmp/ci-shell-hardening.log || true
          } > certification/ci-shell-hardening-diagnostic.txt
          git add certification/ci-shell-hardening-diagnostic.txt
            git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record CI shell hardening diagnostic'
          git push origin HEAD:main
          exit 1
