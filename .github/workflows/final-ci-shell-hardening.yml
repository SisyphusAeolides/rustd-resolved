name: Final CI shell hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - scripts/check-ci-shell-safety.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-ci-shell-hardening
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify every workflow uses strict shells
        run: python3 scripts/check-ci-shell-safety.py

      - name: Verify workflow text has no whitespace errors
        run: git diff --check
