name: Fix RFC5011 open flags

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-rfc5011-open-flags.yml
      - .github/rfc5011-open-flags-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply and verify build fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dnssec_rfc5011_runtime.rs')
          s=p.read_text()
          marker='const DNSKEY_FLAG_REVOKE: u16 = 1 << 7;\n'
          constants='const DNSKEY_FLAG_REVOKE: u16 = 1 << 7;\n// Linux open(2) flags; keep the RFC5011 state publication dependency-free.\nconst O_NOFOLLOW: i32 = 0o400000;\nconst O_CLOEXEC: i32 = 0o2000000;\n'
          if 'const O_NOFOLLOW: i32' not in s:
              if marker not in s: raise SystemExit('constant insertion point missing')
              s=s.replace(marker,constants,1)
          old='.custom_flags(libc::O_NOFOLLOW | libc::O_CLOEXEC)'
          new='.custom_flags(O_NOFOLLOW | O_CLOEXEC)'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('open flag call missing')
          p.write_text(s)
          PY
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran liburing-dev libssl-dev pkg-config
          rustup toolchain install 1.74.0 --profile minimal
          cargo +1.74.0 test --locked --test rfc5011_rollover -- --nocapture --test-threads=1
          git diff --check
          rm -f .github/workflows/fix-rfc5011-open-flags.yml .github/rfc5011-open-flags-trigger
          git add -A src/dnssec_rfc5011_runtime.rs .github/workflows/fix-rfc5011-open-flags.yml .github/rfc5011-open-flags-trigger
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Fix RFC5011 hardened open flags'
          git push origin HEAD:main
