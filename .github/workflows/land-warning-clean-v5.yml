name: Land resolver warning cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-warning-clean-v5.yml

permissions:
  contents: write

concurrency:
  group: land-resolver-warning-clean-v5
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libssl-dev liburing-dev python3
      - name: Apply and verify warning fixes
        id: verify
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/rustd-resolved-warning-clean.log) 2>&1
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          base_sha="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one source fragment in {path}: {old!r}")
                  file.write_text(text.replace(old, new, 1))
              elif new and new not in text:
                  raise SystemExit(f"source fragment missing in {path}: {old!r}")

          def remove_function(path: str, signature: str) -> None:
              file = Path(path)
              text = file.read_text()
              position = text.find(signature)
              if position < 0:
                  return
              start = text.rfind("\n", 0, position) + 1
              while start > 0:
                  previous_end = start - 1
                  previous_start = text.rfind("\n", 0, previous_end) + 1
                  previous = text[previous_start:previous_end].strip()
                  if previous.startswith("#[") and previous.endswith("]"):
                      start = previous_start
                  else:
                      break
              brace = text.find("{", position)
              if brace < 0:
                  raise SystemExit(f"opening brace missing for {signature}")
              depth = 1
              cursor = brace + 1
              while cursor < len(text) and depth:
                  if text[cursor] == "{":
                      depth += 1
                  elif text[cursor] == "}":
                      depth -= 1
                  cursor += 1
              if depth:
                  raise SystemExit(f"unbalanced body for {signature}")
              while cursor < len(text) and text[cursor] in " \t\r\n":
                  cursor += 1
              file.write_text(text[:start] + text[cursor:])

          replace_once(
              "src/mdns_runtime.rs",
              "#[cfg(test)]\nconst TYPE_TXT: u16 = 16;\n",
              "",
          )
          replace_once(
              "src/mdns_runtime.rs",
              "#[cfg(test)]\nconst TYPE_AAAA: u16 = 28;\n",
              "",
          )
          remove_function(
              "src/resolver_edns.rs",
              "    fn tls_possible(&self, server: ServerKey, strict: bool) -> bool",
          )
          remove_function(
              "src/varlink.rs",
              "fn response_flags(response: &[u8]) -> u64",
          )

          replace_once(
              "src/dnssec.rs",
              '''    if first.rr_type == TYPE_DNSKEY && first.name.canonical_wire() == [0] {
        crate::dnssec_rfc5011_runtime::observe_authenticated_dnskey_rrset(
            packet,
            rrset,
            std::slice::from_ref(dnskey_record),
            now,
        )
        .map_err(|error| io::Error::other(format!("RFC5011 trust update failed: {error}")))?;
    }
''',
              '''    if first.rr_type == TYPE_DNSKEY && first.name.canonical_wire() == [0] {
        if let Err(error) = crate::dnssec_rfc5011_runtime::observe_authenticated_dnskey_rrset(
            packet,
            rrset,
            std::slice::from_ref(dnskey_record),
            now,
        ) {
            eprintln!(
                "rustd-resolved: authenticated root DNSKEY verified but RFC5011 state update failed: {error}"
            );
        }
    }
''',
          )

          replacements = (
              ('print_string_field(&label, &value, "llmnr")', 'print_string_field(label, value, "llmnr")'),
              ('print_string_field(&label, &value, "mDNS")', 'print_string_field(label, value, "mDNS")'),
              ('print_string_field(&label, &value, "dnsOverTLS")', 'print_string_field(label, value, "dnsOverTLS")'),
              ('print_string_field(&label, &value, "dnssec")', 'print_string_field(label, value, "dnssec")'),
              ('assert_eq!(parse_boolean("yes").unwrap(), true);', 'assert!(parse_boolean("yes").unwrap());'),
              ('assert_eq!(parse_boolean("t").unwrap(), true);', 'assert!(parse_boolean("t").unwrap());'),
              ('assert_eq!(parse_boolean("OFF").unwrap(), false);', 'assert!(!parse_boolean("OFF").unwrap());'),
              ('assert_eq!(parse_boolean("N").unwrap(), false);', 'assert!(!parse_boolean("N").unwrap());'),
          )
          for old, new in replacements:
              replace_once("src/resolvectl_dbus.rs", old, new)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-features --locked \
            hyper_resolver::hyper_dnssec_tests::anchored_ds_dnskey_chain_fetches_and_rejects_forged_delegation \
            -- --exact
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          make check-native
          make check-packaging
          make check-nss
          make build
          git diff --check
          mkdir -p certification
          cat > certification/source-cleanup-latest.txt <<EOF
          schema=rustd-resolved-source-cleanup-v4
          status=pass
          tested_base_sha=$base_sha
          clippy=pass
          tests=pass
          native=pass
          packaging=pass
          nss=pass
          endpoint_limit=implemented
          production_cfg=pass
          dnssec_persistence_separation=pass
          EOF
          rm -f \
            .github/workflows/land-source-cleanup-v3.yml \
            .github/workflows/land-source-cleanup-v4.yml \
            .github/workflows/land-warning-clean-v5.yml \
            certification/source-cleanup-diagnostic.txt \
            certification/release-closure-diagnostic.txt
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Clean resolver release warnings'
          git pull --rebase origin main
          cargo fmt --all -- --check
          git push origin HEAD:main
      - name: Publish warning-clean diagnostic
        if: steps.verify.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-resolved-warning-clean-diagnostic-v3\n'
            printf 'status=failure\n'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 1000 /tmp/rustd-resolved-warning-clean.log || true
          } > certification/source-cleanup-diagnostic.txt
          git add certification/source-cleanup-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record resolver warning cleanup diagnostic'
          git push origin HEAD:main
          exit 1
