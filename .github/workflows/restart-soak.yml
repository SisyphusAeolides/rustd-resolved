name: Restart soak

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restart-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: Repeat deterministic resolver lifecycles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev python3

      - name: Install stable Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build production binaries
        run: cargo build --release --locked

      - name: Run restart soak
        run: python3 tests/restart-soak.py target/release/rustd-resolved target/release/rustd-resolvectl --cycles 10
