name: Land resolver release cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-release-source-cleanup.yml

permissions:
  contents: write

concurrency:
  group: land-resolver-release-cleanup
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libssl-dev liburing-dev python3

      - name: Apply and verify release cleanup
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          python3 - <<'PY'
          from pathlib import Path

          def remove_exact(path: str, fragment: str) -> None:
              file = Path(path)
              text = file.read_text()
              if fragment in text:
                  file.write_text(text.replace(fragment, "", 1))

          def remove_function(path: str, signature: str) -> None:
              file = Path(path)
              text = file.read_text()
              position = text.find(signature)
              if position < 0:
                  return
              start = text.rfind("\n", 0, position) + 1
              attribute = "#[cfg(test)]\n"
              if text[max(0, start - len(attribute)):start] == attribute:
                  start -= len(attribute)
              brace = text.find("{", position)
              if brace < 0:
                  raise SystemExit(f"{path}: missing opening brace for {signature}")
              depth = 1
              cursor = brace + 1
              while cursor < len(text) and depth:
                  if text[cursor] == "{":
                      depth += 1
                  elif text[cursor] == "}":
                      depth -= 1
                  cursor += 1
              if depth:
                  raise SystemExit(f"{path}: unbalanced function body for {signature}")
              while cursor < len(text) and text[cursor] in " \t\r\n":
                  cursor += 1
              file.write_text(text[:start] + text[cursor:])

          remove_exact("src/mdns_runtime.rs", "#[cfg(test)]\nconst TYPE_TXT: u16 = 16;\n")
          remove_exact("src/mdns_runtime.rs", "#[cfg(test)]\nconst TYPE_AAAA: u16 = 28;\n")
          remove_function(
              "src/resolver_edns.rs",
              "    fn tls_possible(&self, server: ServerKey, strict: bool) -> bool",
          )
          remove_function(
              "src/varlink.rs",
              "fn response_flags(response: &[u8]) -> u64",
          )
          PY

          cat > .github/workflows/final-release-closure.yml <<'YAML'
          name: Final RustD-Resolved release closure

          defaults:
            run:
              shell: 'bash --noprofile --norc -euo pipefail {0}'

          on:
            push:
              branches: [main]
              paths:
                - .github/workflows/final-release-closure.yml
                - src/**
                - ffi/**
                - nss/**
                - packaging/**
                - scripts/**
                - tests/**
                - Cargo.toml
                - Cargo.lock
                - Makefile
                - certification/rfc5011-rollover-latest.txt
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: final-rustd-resolved-release
            cancel-in-progress: true

          jobs:
            certify:
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

                - name: Install native dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install --yes --no-install-recommends \
                      build-essential gfortran pkg-config libssl-dev liburing-dev python3

                - name: Certify resolver release surface
                  run: |
                    grep -Fxq 'status=pass' certification/rfc5011-rollover-latest.txt
                    grep -Fxq 'rust=1.74.0' certification/rfc5011-rollover-latest.txt
                    grep -Fxq 'persistence=reopen-every-transition' certification/rfc5011-rollover-latest.txt
                    grep -Fxq 'revoke=authenticated-self-signature' certification/rfc5011-rollover-latest.txt

                    cc -std=c11 -O1 -g -Wall -Wextra -Werror -Iffi \
                      -fsanitize=address,undefined -fno-omit-frame-pointer \
                      ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
                      -o /tmp/test-iouring-dns-sanitize
                    SR_SKIP_RING=1 ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
                      UBSAN_OPTIONS=halt_on_error=1 /tmp/test-iouring-dns-sanitize
                    cc -std=c11 -O2 -Wall -Wextra -Werror -Iffi \
                      ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
                      -o /tmp/test-iouring-dns
                    /tmp/test-iouring-dns

                    cargo fmt --all -- --check
                    cargo clippy --all-targets --all-features --locked -- -D warnings
                    cargo test --all-targets --all-features --locked
                    make check-native
                    make check-packaging
                    make check-nss
                    make build

                    grep -Fq 'liburing-dev' packaging/debian/control
                    grep -Eq "depends=.*'liburing'" PKGBUILD
                    grep -Eq "makedepends=.*'liburing'" PKGBUILD
                    grep -Fq 'cargo:rustc-link-lib=uring' build.rs
                    grep -Fq 'cargo:rerun-if-changed=ffi/iouring_dns.h' build.rs

                    root="$(mktemp -d)"
                    trap 'rm -rf "$root"' EXIT HUP INT TERM
                    make DESTDIR="$root" install
                    test -x "$root/usr/lib/rustd/rustd-resolved"
                    test -x "$root/usr/bin/rustd-resolvectl"
                    test -f "$root/usr/lib/libnss_rustd_dns.so.2"
                    test -f "$root/usr/lib/rustd/system/rustd-resolved.service"
                    test -f "$root/usr/share/dbus-1/system-services/org.freedesktop.resolve1.service"
                    test -f "$root/usr/lib/tmpfiles.d/rustd-resolved.conf"

                    bad="$(grep -R -nE 'systemctl|/run/systemd/resolve|resolvectl-rs' "$root" || true)"
                    test -z "$bad" || { printf '%s\n' "$bad" >&2; exit 1; }
                    legacy="$(grep -R -nF 'systemd-resolved' "$root" \
                      | grep -v 'Conflicts=systemd-resolved.service' \
                      | grep -v 'systemd-resolved=false' \
                      || true)"
                    test -z "$legacy" || { printf '%s\n' "$legacy" >&2; exit 1; }

                    grep -Fq 'ProtectSystem=strict' packaging/rustd/rustd-resolved.service
                    grep -Fq 'ReadWritePaths=/run/rustd /var/lib/rustd/resolved' packaging/rustd/rustd-resolved.service
                    grep -Fq 'ExecStart=/usr/lib/rustd/rustd-resolved --dbus' packaging/rustd/rustd-resolved.service
                    grep -Fq 'L+ /etc/resolv.conf - - - - /run/rustd/resolve/stub-resolv.conf' packaging/tmpfiles/rustd-resolved.conf
                    grep -Fq 'hosts: files rustd_dns [!UNAVAIL=return] dns' packaging/nsswitch.conf.fragment

                    {
                      printf '### RustD-Resolved release closure\n\n'
                      printf -- '- Rust, native, packaging, NSS, install-image, and RFC5011 gates passed.\n'
                      printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
                    } >> "$GITHUB_STEP_SUMMARY"
          YAML

          rm -f \
            certification/release-closure-diagnostic.txt \
            certification/source-cleanup-diagnostic.txt \
            .github/workflows/land-release-source-cleanup.yml

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          make check-native
          make check-packaging
          make check-nss
          make build
          git diff --check

          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Clean resolver release source and CI'
          git pull --rebase origin main
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          git push origin HEAD:main