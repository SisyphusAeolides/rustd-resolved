name: Live upstream failover churn

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-failover-churn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failover-churn:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 8m sudo apt-get -o Acquire::Retries=3 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            gfortran libssl-dev liburing-dev

      - name: Build resolver
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Reverse live upstream failure roles one hundred times
        run: |
          set -euo pipefail
          evidence=/tmp/rustd-failover-churn-ci.jsonl
          python3 scripts/failover-churn-driver.py \
            --repository "$PWD" \
            --binary target/release/rustd-resolved \
            --iterations 100 \
            --evidence-out "$evidence" \
            2>&1 | tee /tmp/failover-churn-live.log
          chmod 0600 "$evidence"
          python3 - "$evidence" "$GITHUB_SHA" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("failover churn evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(records) != 1:
              raise SystemExit("expected exactly one failover churn evidence record")
          record = records[0]
          if record.get("gate") != "dns.failover_churn" or record.get("status") != "pass":
              raise SystemExit("unexpected failover churn gate/status")
          if record.get("resolver_sha") != expected_sha:
              raise SystemExit("failover churn evidence SHA mismatch")
          if int(record.get("iterations", 0)) < 100:
              raise SystemExit("dns.failover_churn evidence records fewer than 100 role reversals")
          if not str(record.get("detail", "")).strip():
              raise SystemExit("dns.failover_churn evidence detail is empty")
          print("certification evidence OK: dns.failover_churn")
          PY

      - name: Upload failover churn evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failover-churn-live-${{ github.sha }}
          path: |
            /tmp/failover-churn-live.log
            /tmp/rustd-failover-churn-ci.jsonl
          if-no-files-found: warn
          retention-days: 14
