name: Native build contract hardening
# retrigger after installation

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-contract-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Patch and validate build contract
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran libssl-dev liburing-dev
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.rs')
          s = p.read_text()
          if s.startswith('#![allow(warnings)]\n'):
              s = s[len('#![allow(warnings)]\n'):]
          anchor = '    println!("cargo:rerun-if-changed=ffi/iouring_dns.c");\n'
          addition = anchor + '    println!("cargo:rerun-if-changed=ffi/iouring_dns.h");\n'
          if 'cargo:rerun-if-changed=ffi/iouring_dns.h' not in s:
              if anchor not in s:
                  raise SystemExit('io_uring rerun anchor missing')
              s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
          git diff --check
          cargo check --all-targets --all-features --locked
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iffi \
            ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
            -o /tmp/test-iouring-dns
          /tmp/test-iouring-dns
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/build-contract-hardening.yml
          git add build.rs .github/workflows/build-contract-hardening.yml
          git diff --cached --check
          git config user.name 'Kenny Glauner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Track io_uring FFI header changes'
          git push origin HEAD:main
