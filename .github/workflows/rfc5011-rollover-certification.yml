name: RFC5011 rollover certification

on:
  push:
    branches:
      - main
    paths:
      - src/dnssec_rfc5011.rs
      - src/dnssec_rfc5011_runtime.rs
      - src/dnssec.rs
      - src/main.rs
      - tests/rfc5011_rollover.rs
      - .github/workflows/rfc5011-rollover-certification.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.75.0
      - name: Run persistent rollover lifecycle
        id: certify
        shell: bash
        run: cargo test --locked --test rfc5011_rollover -- --nocapture --test-threads=1
      - name: Publish exact-SHA rollover voucher
        if: always()
        shell: bash
        env:
          CERT_OUTCOME: ${{ steps.certify.outcome }}
        run: |
          set -euo pipefail
          status=failure
          if [ "$CERT_OUTCOME" = success ]; then status=pass; fi
          tested_sha="$GITHUB_SHA"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          printf 'schema=rustd-resolved-rfc5011-rollover-v1\nstatus=%s\ntested_sha=%s\ncert_outcome=%s\npersistence=reopen-every-transition\nrevoke=authenticated-self-signature\n' \
              "$status" "$tested_sha" "$CERT_OUTCOME" > certification/rfc5011-rollover-latest.txt
          git add certification/rfc5011-rollover-latest.txt
          if git diff --cached --quiet; then
              [ "$status" = pass ]
              exit
          fi
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m "Record RFC5011 rollover certification $status"
          git push origin HEAD:main
          [ "$status" = pass ]
