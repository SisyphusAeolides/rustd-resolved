name: RFC5011 rollover certification
# rerun after hardened open flag fix

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

on:
  push:
    branches:
      - main
    paths:
      - src/dnssec_rfc5011.rs
      - src/dnssec_rfc5011_runtime.rs
      - src/dnssec.rs
      - src/main.rs
      - tests/rfc5011_rollover.rs
      - .github/workflows/rfc5011-rollover-certification.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rfc5011-rollover-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.74.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran liburing-dev libssl-dev pkg-config
      - name: Run persistent rollover lifecycle
        id: certify
        run: |
          cargo +1.74.0 test --locked --test rfc5011_rollover -- --nocapture --test-threads=1 2>&1 | tee /tmp/rfc5011-rollover.log
      - name: Publish exact-SHA rollover voucher
        if: always()
        env:
          CERT_OUTCOME: ${{ steps.certify.outcome }}
        run: |
          status=failure
          if [ "$CERT_OUTCOME" = success ]; then status=pass; fi
          tested_sha="$GITHUB_SHA"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          existing_sha=""
          if [ -f certification/rfc5011-rollover-latest.txt ]; then
              existing_sha="$(sed -n 's/^tested_sha=//p' certification/rfc5011-rollover-latest.txt | head -n1)"
          fi
          if [ -n "$existing_sha" ] && git cat-file -e "$existing_sha^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$tested_sha" "$existing_sha"; then
              echo "newer RFC5011 voucher already exists for $existing_sha; not overwriting with $tested_sha"
              exit 0
          fi
          printf 'schema=rustd-resolved-rfc5011-rollover-v1\nstatus=%s\ntested_sha=%s\ncert_outcome=%s\nrust=1.74.0\npersistence=reopen-every-transition\nrevoke=authenticated-self-signature\n' \
              "$status" "$tested_sha" "$CERT_OUTCOME" > certification/rfc5011-rollover-latest.txt
          if [ "$status" = failure ] && [ -f /tmp/rfc5011-rollover.log ]; then
              tail -n 120 /tmp/rfc5011-rollover.log > certification/rfc5011-rollover-diagnostic.txt
          else
              rm -f certification/rfc5011-rollover-diagnostic.txt
          fi
          git add -A certification/
          if git diff --cached --quiet; then
              [ "$status" = pass ]
              exit
          fi
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m "Record RFC5011 rollover certification $status"
          bash scripts/push-certification-voucher.sh
          [ "$status" = pass ]
