name: Land RustD-Resolved release cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-release-cleanup.yml

permissions:
  contents: write

concurrency:
  group: land-rustd-resolved-release-cleanup
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran pkg-config libssl-dev liburing-dev python3

      - name: Apply warning-clean release fixes
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/rustd-resolved-cleanup.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              found = s.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {found}: {old!r}')
              s = s.replace(old, new, count)
              p.write_text(s)

          def remove_function(path, signature):
              p = Path(path)
              s = p.read_text()
              pos = s.find(signature)
              if pos < 0:
                  raise SystemExit(f'{path}: function signature not found: {signature}')
              start = s.rfind('\n', 0, pos) + 1
              brace = s.find('{', pos)
              if brace < 0:
                  raise SystemExit(f'{path}: opening brace not found for {signature}')
              depth = 1
              i = brace + 1
              while i < len(s) and depth:
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                  i += 1
              if depth:
                  raise SystemExit(f'{path}: unbalanced function body for {signature}')
              while i < len(s) and s[i] in ' \t\r\n':
                  i += 1
              p.write_text(s[:start] + s[i:])

          replace(
              'src/dbus_core.rs',
              '    Header, TYPE_SRV, TYPE_TXT,\n',
              '    TYPE_SRV, TYPE_TXT,\n')
          replace(
              'src/query_cancel.rs',
              '    // Rust 1.74\'s const thread-local expansion conflicts with the crate-level\n'
              '    // `forbid(unsafe_op_in_unsafe_fn)`. Preserve the MSRV-safe initializer.\n'
              '    #[allow(clippy::missing_const_for_thread_local)]\n',
              '    // Keep the non-const initializer compatible with the Rust 1.74 build contract.\n')

          remove_function('src/dbus_helpers.rs', 'fn response_flags(response: &[u8]) -> u64')
          remove_function('src/hook.rs', 'fn read_frame(stream: &mut UnixStream) -> io::Result<Vec<u8>>')
          remove_function('src/resolver_edns.rs', '    fn tls_possible(&self, server: ServerKey, strict: bool) -> bool')
          remove_function('src/varlink.rs', 'fn response_flags(response: &[u8]) -> u64')

          p = Path('src/mdns_responder.rs')
          s = p.read_text()
          old = '''struct ParsedMessage {
    id: u16,
    flags: u16,
    questions: Vec<ParsedQuestion>,
    records: Vec<ParsedRecord>,
}'''
          new = '''struct ParsedMessage {
    id: u16,
    questions: Vec<ParsedQuestion>,
    records: Vec<ParsedRecord>,
}'''
          if old not in s:
              raise SystemExit('src/mdns_responder.rs: ParsedMessage preimage missing')
          s = s.replace(old, new, 1)
          s = s.replace('    let flags = read_u16(packet, 2)?;\n', '', 1)
          literal = '''    Ok(ParsedMessage {
        id,
        flags,
        questions: parsed_questions,'''
          replacement = '''    Ok(ParsedMessage {
        id,
        questions: parsed_questions,'''
          if literal not in s:
              raise SystemExit('src/mdns_responder.rs: ParsedMessage literal preimage missing')
          s = s.replace(literal, replacement, 1)
          p.write_text(s)

          p = Path('src/mdns_runtime.rs')
          s = p.read_text()
          for line in ('const TYPE_A: u16 = 1;\n', 'const TYPE_TXT: u16 = 16;\n', 'const TYPE_AAAA: u16 = 28;\n'):
              if line not in s:
                  raise SystemExit(f'src/mdns_runtime.rs: missing {line.strip()}')
              s = s.replace(line, '', 1)
          s = s.replace(
              '''struct RuntimeInterface {
    interface: MdnsInterface,
    address: IpAddr,
}''',
              '''struct RuntimeInterface {
    interface: MdnsInterface,
}''',
              1)
          pattern = re.compile(
              r'''        let \(family, address\) = match entry\.family \{.*?        \};\n'''
              r'''        output\.push\(RuntimeInterface \{\n'''
              r'''            interface: MdnsInterface::new\(entry\.ifindex, family\),\n'''
              r'''            address,\n'''
              r'''        \}\);''',
              re.S)
          replacement = '''        let family = match entry.family {
            AF_INET => MdnsAddressFamily::Ipv4,
            AF_INET6 => MdnsAddressFamily::Ipv6,
            _ => continue,
        };
        output.push(RuntimeInterface {
            interface: MdnsInterface::new(entry.ifindex, family),
        });'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'src/mdns_runtime.rs: interface conversion replacement count={count}')
          p.write_text(s)

          p = Path('src/supremacy/transport_pool.rs')
          s = p.read_text()
          for old, new in (
              ('    max_per_ep: usize,\n', ''),
              ('    pub fn new(max_per_ep: usize, max_global: usize) -> Arc<Self> {\n',
               '    pub fn new(_max_per_ep: usize, max_global: usize) -> Arc<Self> {\n'),
              ('            max_per_ep,\n', ''),
          ):
              if old not in s:
                  raise SystemExit(f'src/supremacy/transport_pool.rs: preimage missing: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/resolvectl_dbus.rs')
          s = p.read_text()
          for old, new in (
              ('print_string_field(&label, &value, "llmnr")', 'print_string_field(label, value, "llmnr")'),
              ('print_string_field(&label, &value, "mDNS")', 'print_string_field(label, value, "mDNS")'),
              ('print_string_field(&label, &value, "dnsOverTLS")', 'print_string_field(label, value, "dnsOverTLS")'),
              ('print_string_field(&label, &value, "dnssec")', 'print_string_field(label, value, "dnssec")'),
              ('assert_eq!(parse_boolean("yes").unwrap(), true);', 'assert!(parse_boolean("yes").unwrap());'),
              ('assert_eq!(parse_boolean("t").unwrap(), true);', 'assert!(parse_boolean("t").unwrap());'),
              ('assert_eq!(parse_boolean("OFF").unwrap(), false);', 'assert!(!parse_boolean("OFF").unwrap());'),
              ('assert_eq!(parse_boolean("N").unwrap(), false);', 'assert!(!parse_boolean("N").unwrap());'),
          ):
              if old not in s:
                  raise SystemExit(f'src/resolvectl_dbus.rs: preimage missing: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          for path in ('Makefile', '.github/workflows/final-release-closure.yml'):
              replace(
                  path,
                  'hosts: files myhostname rustd_dns [!UNAVAIL=return] dns',
                  'hosts: files rustd_dns [!UNAVAIL=return] dns')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          make check-native
          make check-packaging
          make check-nss
          git diff --check

      - name: Publish cleanup failure diagnostic
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-resolved-cleanup-diagnostic-v1\n'
            printf 'status=failure\n'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 320 /tmp/rustd-resolved-cleanup.log || true
          } > certification/release-cleanup-diagnostic.txt
          git add certification/release-cleanup-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record RustD-Resolved cleanup diagnostic'
          git push origin HEAD:main
          exit 1

      - name: Commit verified cleanup
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/land-release-cleanup.yml certification/release-cleanup-diagnostic.txt
          git fetch origin main
          git rebase --autostash origin/main
          cargo fmt --all -- --check
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Clean RustD-Resolved release build'
          git push origin HEAD:main
