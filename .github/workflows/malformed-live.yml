name: Live malformed DNS campaign

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malformed-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malformed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Build resolver
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Send 10000 malformed live cases
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/scenarios/malformed_live_campaign.py \
            target/release/rustd-resolved \
            --cases 10000 2>&1 | tee /tmp/malformed-live.log

      - name: Upload malformed-campaign diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: malformed-live-${{ github.sha }}
          path: /tmp/malformed-live.log
          if-no-files-found: error
          retention-days: 14
