name: Live malformed DNS campaign

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malformed-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malformed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Build resolver
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Send 10000 malformed live cases
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/rustd-malformed-live-ci.jsonl
          python3 tests/scenarios/malformed_live_campaign.py \
            target/release/rustd-resolved \
            --cases 10000 \
            --evidence-out "$evidence" \
            2>&1 | tee /tmp/malformed-live.log
          chmod 0600 "$evidence"
          python3 - "$evidence" "$GITHUB_SHA" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("malformed evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(records) != 1:
              raise SystemExit(f"expected one malformed evidence record, got {len(records)}")
          record = records[0]
          if record.get("gate") != "dns.malformed" or record.get("status") != "pass":
              raise SystemExit("malformed evidence gate/status is invalid")
          if record.get("resolver_sha") != expected_sha:
              raise SystemExit("malformed evidence resolver_sha does not match GITHUB_SHA")
          if int(record.get("cases", 0)) < 10000:
              raise SystemExit("malformed evidence records fewer than 10000 cases")
          if not str(record.get("detail", "")).strip():
              raise SystemExit("malformed evidence detail is empty")
          print("certification evidence OK: dns.malformed")
          PY

      - name: Upload malformed-campaign evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: malformed-live-${{ github.sha }}
          path: |
            /tmp/malformed-live.log
            /tmp/rustd-malformed-live-ci.jsonl
          if-no-files-found: warn
          retention-days: 14
