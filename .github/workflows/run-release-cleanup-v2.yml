name: Run isolated RustD-Resolved cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-release-cleanup-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-rustd-resolved-cleanup-v2
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install native dependencies
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libssl-dev liburing-dev python3

      - name: Execute corrected cleanup recipe
        id: cleanup
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/rustd-resolved-cleanup-v2.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/run-release-cleanup.yml').read_text()
          step = text.index('      - name: Apply release fixes and verify the full tree\n')
          marker = '        run: |\n'
          start = text.index(marker, step) + len(marker)
          end = text.index('      - name: Publish failure diagnostic\n', start)
          raw = text[start:end]
          lines = []
          for line in raw.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/rustd-resolved-cleanup-v2.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/rustd-resolved-cleanup-v2.sh

      - name: Publish isolated failure diagnostic
        if: steps.cleanup.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-resolved-cleanup-diagnostic-v4\n'
            printf 'status=failure\n'
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 600 /tmp/rustd-resolved-cleanup-v2.log || true
          } > certification/release-cleanup-diagnostic.txt
          git add certification/release-cleanup-diagnostic.txt
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record isolated resolver cleanup diagnostic'
          git push origin HEAD:main
          exit 1

      - name: Land verified cleanup
        if: steps.cleanup.outcome == 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          mkdir -p certification
          {
            printf 'schema=rustd-resolved-cleanup-v2\n'
            printf 'status=pass\n'
            printf 'tested_base_sha=%s\n' "$GITHUB_SHA"
            printf 'clippy=pass\n'
            printf 'tests=pass\n'
            printf 'native=pass\n'
            printf 'packaging=pass\n'
            printf 'nss=pass\n'
            printf 'endpoint_concurrency=bounded\n'
          } > certification/release-cleanup-latest.txt
          rm -f \
            .github/workflows/land-release-cleanup.yml \
            .github/workflows/run-release-cleanup.yml \
            .github/workflows/run-release-cleanup-v2.yml \
            certification/release-cleanup-diagnostic.txt \
            certification/release-closure-diagnostic.txt
          git fetch origin main
          git rebase --autostash origin/main
          cargo fmt --all -- --check
          git add -A
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Clean RustD-Resolved release build'
          git push origin HEAD:main
