name: Run resolver release rustfmt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-release-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: resolver-release-rustfmt
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.74.0
          components: rustfmt
      - name: Format exact release candidate
        id: fmt
        continue-on-error: true
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          exec > >(tee /tmp/resolver-rustfmt.log) 2>&1
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git fetch origin main
          git rebase origin/main
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          rm -f .github/workflows/land-release-rustfmt.yml .github/workflows/run-release-rustfmt.yml
          git add -A src tests .github/workflows/land-release-rustfmt.yml .github/workflows/run-release-rustfmt.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Format resolver release source'
          git push origin HEAD:main
      - name: Publish formatter failure
        if: steps.fmt.outcome != 'success'
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          git reset --hard HEAD
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p certification
          {
            printf 'schema=rustd-resolved-rustfmt-diagnostic-v1\nstatus=failure\ntested_sha=%s\n' "$GITHUB_SHA"
            printf '%s\n' '--- tail ---'
            tail -n 180 /tmp/resolver-rustfmt.log || true
          } > certification/rustfmt-diagnostic.txt
          git add certification/rustfmt-diagnostic.txt
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Record resolver rustfmt diagnostic'
          git push origin HEAD:main
          exit 1
