name: Network lab contract

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-lab-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate first-party network lab
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/network-lab-driver.py \
            scripts/blackhole-lab-driver.py \
            tests/scenarios/lab_dns_server.py \
            tests/scenarios/lab_dns_probe.py \
            tests/scenarios/malformed_live_campaign.py
          bash -n tests/scenarios/test_network_churn.sh
          test -x scripts/network-lab-driver.py
          test -x scripts/blackhole-lab-driver.py
          python3 scripts/network-lab-driver.py --help >/dev/null
          python3 scripts/blackhole-lab-driver.py --help >/dev/null
          python3 tests/scenarios/malformed_live_campaign.py --help >/dev/null
          grep -Fq 'RUSTD_RESOLVED_LAB_DRIVER:-$ROOT/scripts/network-lab-driver.py' \
            tests/scenarios/test_network_churn.sh
          grep -Fq 'options.iterations < 50' scripts/network-lab-driver.py
          grep -Fq 'options.iterations < 20' scripts/blackhole-lab-driver.py
          grep -Fq 'cases < 10_000' tests/scenarios/malformed_live_campaign.py
          grep -Fq '"resolver_sha": revision' scripts/network-lab-driver.py
          grep -Fq '"resolver_sha": revision' scripts/blackhole-lab-driver.py
          grep -Fq '"gate": "dns.malformed"' tests/scenarios/malformed_live_campaign.py
