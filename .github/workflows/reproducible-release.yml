name: Reproducible native release

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

run-name: Reproducible native release ${{ inputs.source_sha || github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Git commit to reproduce; blank selects the dispatch ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    name: Build byte-identical RustD resolver release
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact source identity
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ $REQUESTED_SHA =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Install Rust 1.74 and native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev
          rustup toolchain install 1.74.0 --profile minimal
          rustup default 1.74.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Build and compare native release twice
        run: bash scripts/build-reproducible-release.sh

      - name: Upload native reproducible release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustd-resolved-reproducible-${{ inputs.source_sha || github.sha }}
          path: target/reproducible-release
          if-no-files-found: error
          retention-days: 30
