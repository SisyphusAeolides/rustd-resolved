name: Reproducible native release
run-name: Reproducible native release ${{ inputs.source_sha || github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Git commit to reproduce; blank selects the dispatch ref
        required: false
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  reproduce:
    name: Build byte-identical RustD resolver release
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ $REQUESTED_SHA =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Install Rust 1.74 and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev
          rustup toolchain install 1.74.0 --profile minimal
          rustup default 1.74.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Build and compare native release twice
        shell: bash
        run: bash scripts/build-reproducible-release.sh

      - name: Upload native reproducible release
        uses: actions/upload-artifact@v7
        with:
          name: rustd-resolved-reproducible-${{ inputs.source_sha || github.sha }}
          path: target/reproducible-release
          if-no-files-found: error
          retention-days: 30

      - name: Publish native reproducibility status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="RustD resolver reproducibility failed"
          if [[ "$RESULT" == success ]]; then
            state=success
            description="RustD resolver release is byte-identical"
          fi
          export state description
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['SOURCE_SHA']}"
          payload = {
              "state": os.environ["state"],
              "context": "rustd-resolved/reproducibility",
              "description": os.environ["description"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              response.read()
          PY
