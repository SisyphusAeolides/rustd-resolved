name: Land Fedora NSS cutover contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-fedora-nss-cutover.yml
      - .github/workflows/final-release-closure.yml
      - Makefile
      - packaging/nsswitch.conf.fragment
      - tests/rustd_naming.rs
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gfortran pkg-config libssl-dev liburing-dev python3

      - name: Verify systemd-free NSS contract
        run: |
          grep -Fqx 'hosts: files rustd_dns [!UNAVAIL=return] dns' packaging/nsswitch.conf.fragment
          ! grep -Fq 'myhostname' packaging/nsswitch.conf.fragment
          grep -Fq 'hosts: files rustd_dns [!UNAVAIL=return] dns' Makefile
          grep -Fq 'hosts: files rustd_dns [!UNAVAIL=return] dns' .github/workflows/final-release-closure.yml
          cargo test --locked --test rustd_naming
          make check-packaging
