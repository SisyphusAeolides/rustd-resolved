name: Upstream reload churn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-reload-churn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  churn:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Build resolver
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Exercise repeated live upstream reloads
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/scenarios/upstream_reload_churn.py \
            target/release/rustd-resolved \
            --cycles 20
