name: Upstream reload churn

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-reload-churn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  churn:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Build resolver
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Exercise repeated live upstream reloads
        run: |
          set -euo pipefail
          python3 tests/scenarios/upstream_reload_churn.py \
            target/release/rustd-resolved \
            --cycles 20 2>&1 | tee /tmp/upstream-reload-churn.log

      - name: Upload churn diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-reload-churn-${{ github.sha }}
          path: /tmp/upstream-reload-churn.log
          if-no-files-found: error
          retention-days: 14
