name: Live mDNS responder verification

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-mdns-responder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build and namespace tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran iproute2 libssl-dev liburing-dev

      - name: Build the release daemon
        run: cargo build --release --locked --bin rustd-resolved

      - name: Exercise conflict and response semantics
        run: python3 tests/live-mdns-responder.py target/release/rustd-resolved
