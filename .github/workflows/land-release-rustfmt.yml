name: Land resolver release formatting
# trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-release-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.74.0
          components: rustfmt
      - name: Format and verify resolver candidate
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git fetch origin main
          git rebase origin/main
          cargo fmt --all
          cargo fmt --all -- --check
          rm -f .github/workflows/land-release-rustfmt.yml
          git add -A src/dnssec_rfc5011.rs src/dnssec_rfc5011_runtime.rs \
            tests/rfc5011_rollover.rs .github/workflows/land-release-rustfmt.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Format RFC5011 release code'
          git push origin HEAD:main
