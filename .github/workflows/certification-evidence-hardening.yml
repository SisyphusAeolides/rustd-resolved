name: Certification evidence hardening

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-evidence-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate certification evidence handling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/resource-soak-driver.py \
            scripts/validate-benchmark-report.py \
            scripts/validate-certification-evidence.py \
            tests/test-certification-hardening.py
          python3 tests/test-certification-hardening.py

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/bin" "$work/reports"
          cat >"$work/bin/cargo" <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod 0755 "$work/bin/cargo"
          printf 'protected\n' >"$work/protected"
          ln -s "$work/protected" "$work/reports/resolver-certification.jsonl"
          PATH="$work/bin:$PATH" \
            RUSTD_CERT_REPORT_DIR="$work/reports" \
            scripts/installed-certification.sh --smoke
          test "$(cat "$work/protected")" = protected
          test ! -L "$work/reports/resolver-certification.jsonl"
          test "$(stat -c '%a' "$work/reports/resolver-certification.jsonl")" = 600
          python3 - "$work/reports/resolver-certification.jsonl" <<'PY'
          import json
          import pathlib
          import sys

          records = [
              json.loads(line)
              for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert records
          assert all(record.get("resolver_sha") for record in records)
          PY
