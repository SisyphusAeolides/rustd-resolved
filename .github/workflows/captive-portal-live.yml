name: Live captive DNS transition

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'


on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captive-dns-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captive-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 8m sudo apt-get -o Acquire::Retries=3 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            gfortran libssl-dev liburing-dev

      - name: Build resolver
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rustd-resolved

      - name: Evict long-TTL captive DNS across ten live network transitions
        run: |
          set -euo pipefail
          evidence=/tmp/rustd-captive-portal-ci.jsonl
          python3 scripts/captive-portal-driver.py \
            --repository "$PWD" \
            --binary target/release/rustd-resolved \
            --iterations 10 \
            --evidence-out "$evidence" \
            2>&1 | tee /tmp/captive-portal-live.log
          chmod 0600 "$evidence"
          python3 - "$evidence" "$GITHUB_SHA" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("captive portal evidence mode must be 0600")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(records) != 1:
              raise SystemExit("expected exactly one captive portal evidence record")
          record = records[0]
          if record.get("gate") != "dns.captive_portal" or record.get("status") != "pass":
              raise SystemExit("unexpected captive portal gate/status")
          if record.get("resolver_sha") != expected_sha:
              raise SystemExit("captive portal evidence SHA mismatch")
          if int(record.get("iterations", 0)) < 10:
              raise SystemExit("dns.captive_portal evidence records fewer than ten transitions")
          if not str(record.get("detail", "")).strip():
              raise SystemExit("dns.captive_portal evidence detail is empty")
          print("certification evidence OK: dns.captive_portal")
          PY

      - name: Upload captive transition evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captive-dns-transition-${{ github.sha }}
          path: |
            /tmp/captive-portal-live.log
            /tmp/rustd-captive-portal-ci.jsonl
          if-no-files-found: warn
          retention-days: 14
