name: Include Fedora packaging in resolver release closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/include-fedora-in-release-closure.yml
      - .github/workflows/final-release-closure.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Fedora artifacts are in the release trigger
        run: |
          grep -Fqx '      - dist/**' .github/workflows/final-release-closure.yml
          grep -Fqx '      - packaging/**' .github/workflows/final-release-closure.yml
          git diff --check
