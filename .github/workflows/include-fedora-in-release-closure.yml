name: Include Fedora packaging in resolver release closure
# trigger with autostash

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/include-fedora-in-release-closure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Extend resolver release trigger to Fedora packaging
        shell: 'bash --noprofile --norc -euo pipefail {0}'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/final-release-closure.yml')
          s=p.read_text()
          anchor='      - packaging/**\n'
          addition='      - packaging/**\n      - dist/**\n'
          if '      - dist/**\n' not in s:
              if anchor not in s:
                  raise SystemExit('release path trigger insertion point missing')
              s=s.replace(anchor,addition,1)
          p.write_text(s)
          PY
          git diff --check
          git fetch origin main
          git rebase --autostash origin/main
          rm -f .github/workflows/include-fedora-in-release-closure.yml
          git add -A .github/workflows/final-release-closure.yml .github/workflows/include-fedora-in-release-closure.yml
          git diff --cached --check
          git config user.name 'Kenny Glowner'
          git config user.email 'SisyphusAeolides@pm.me'
          git commit -m 'Certify Fedora resolver packaging changes'
          git push origin HEAD:main
