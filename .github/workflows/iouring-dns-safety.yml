name: io_uring DNS safety

on:
  push:
    branches: [main]
    paths:
      - ffi/iouring_dns.c
      - ffi/iouring_dns.h
      - ffi/test_iouring_dns.c
      - build.rs
      - packaging/debian/control
      - PKGBUILD
      - .github/workflows/iouring-dns-safety.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iouring-dns-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential liburing-dev

      - name: Compile and run loopback io_uring contract
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong \
            -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Iffi \
            ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
            -o /tmp/test-iouring-dns
          /tmp/test-iouring-dns

      - name: Run DNS name walker under ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iffi \
            ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
            -o /tmp/test-iouring-dns-sanitized
          SR_SKIP_RING=1 \
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:strict_string_checks=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            /tmp/test-iouring-dns-sanitized

      - name: Verify packaging and build linkage contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'Build-Depends:.*liburing-dev' packaging/debian/control
          grep -Eq "depends=.*'liburing'" PKGBUILD
          grep -Eq "makedepends=.*'liburing'" PKGBUILD
          grep -Fq 'cargo:rustc-link-lib=uring' build.rs
