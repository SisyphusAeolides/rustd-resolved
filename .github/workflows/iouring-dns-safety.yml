name: io_uring DNS safety
# refresh exact-SHA certificate

defaults:
  run:
    shell: 'bash --noprofile --norc -euo pipefail {0}'

on:
  push:
    branches: [main]
    paths:
      - ffi/iouring_dns.c
      - ffi/iouring_dns.h
      - ffi/test_iouring_dns.c
      - build.rs
      - packaging/debian/control
      - PKGBUILD
      - .github/workflows/iouring-dns-safety.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iouring-dns-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential liburing-dev

      - name: Exercise io_uring and sanitizer contracts
        id: safety_checks
        continue-on-error: true
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -fstack-protector-strong \
            -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Iffi \
            ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
            -o /tmp/test-iouring-dns
          /tmp/test-iouring-dns

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iffi \
            ffi/test_iouring_dns.c ffi/iouring_dns.c -luring \
            -o /tmp/test-iouring-dns-sanitized
          SR_SKIP_RING=1 \
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:strict_string_checks=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            /tmp/test-iouring-dns-sanitized

          grep -Eq 'Build-Depends:.*liburing-dev' packaging/debian/control
          grep -Eq "depends=.*'liburing'" PKGBUILD
          grep -Eq "makedepends=.*'liburing'" PKGBUILD
          grep -Fq 'cargo:rustc-link-lib=uring' build.rs
          grep -Fq 'cargo:rerun-if-changed=ffi/iouring_dns.h' build.rs

      - name: Publish exact safety voucher
        if: always()
        run: |
          outcome='${{ steps.safety_checks.outcome }}'
          mkdir -p certification
          cat > certification/iouring-dns-safety-latest.txt <<EOF
          schema=rustd-resolved-iouring-dns-safety-v1
          status=$outcome
          tested_sha=$GITHUB_SHA
          dns_name_bitmap=asan-ubsan
          udp_peer_addressing=recvmsg-sendmsg-loopback
          liburing_packaging=checked
          ffi_header_rebuild_tracking=checked
          EOF
          git add certification/iouring-dns-safety-latest.txt
          if ! git diff --cached --quiet; then
            git config user.name 'Kenny Glowner'
            git config user.email 'SisyphusAeolides@pm.me'
            git commit -m 'Record io_uring DNS safety certification'
            bash scripts/push-certification-voucher.sh
          fi
          test "$outcome" = success
